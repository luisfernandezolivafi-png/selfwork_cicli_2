<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Cicli 2</title>
</head>
<body>

    <script>
        let sommaDispari = 0;
        let contatoreDispari = 0;

        for (let i = 1; i <= 20; i++) {
            if (i % 2 === 0) {
                console.log(i);
            } else {
                sommaDispari += i;
                contatoreDispari++;
            }
        }

        let mediaDispari = sommaDispari / contatoreDispari;

        console.log(`La media dei numeri dispari è ${mediaDispari}`);
    </script>
</body>
</html>
